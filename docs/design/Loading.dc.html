      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 24px; align-items: center; height: 56px; padding: 0 24px; border-top: 1px solid #EEECE7;"><span style="width: 70px; height: 12px; border-radius: 6px; background: #ECEAE5;"></span><span style="width: 24px; height: 12px; border-radius: 6px; background: #ECEAE5; justify-self: end;"></span><span style="width: 150px; height: 12px; border-radius: 6px; background: #ECEAE5;"></span><span style="width: 140px; height: 12px; border-radius: 6px; background: #ECEAE5;"></span></div>
